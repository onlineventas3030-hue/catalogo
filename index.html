<!-- SCRIPT DE LÓGICA Y CONEXIÓN SUPABASE -->
    <script>
        const SUPABASE_URL = 'https://hohtterveiinsjaqgrrl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvaHR0ZXJ2ZWlpbnNqYXFncnJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzODMwNTUsImV4cCI6MjEwNzk1OTA1NX0.hln-Mdy5NKLC_GRNldww302Dgsk4dCg7G8LNu5BEJgY';
        
        const ADMIN_CREDENTIALS = {
            user: "Admin3434",
            pass: "Panama2006!!"
        };

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let products = [];
        let categories = [];
        let cart = [];
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            fetchInitialData();
            setupRealtimeSubscriptions();
        });

        async function fetchInitialData() {
            try {
                const [catRes, prodRes] = await Promise.all([
                    supabaseClient.from('categories').select('*'),
                    supabaseClient.from('products').select('*, categories(id, name)')
                ]);

                if (catRes.error) throw catRes.error;
                if (prodRes.error) throw prodRes.error;

                categories = catRes.data || [];
                products = prodRes.data || [];

                renderCategories();
                renderProducts();
                renderAdminInventory();
                populateCategoryDropdown();
            } catch (error) {
                console.error("Error cargando datos:", error.message);
                document.getElementById('products-grid').innerHTML = `<div class="col-span-full text-center py-12 text-red-400">Error al conectar con la base de datos. Verifica tus credenciales.</div>`;
            }
        }

        function setupRealtimeSubscriptions() {
            supabaseClient
                .channel('public-db-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, payload => {
                    fetchInitialData();
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
                    triggerAudioNotification();
                    showInstantNotification(payload.new);
                    fetchAdminOrders();
                })
                .subscribe();
        }

        function triggerAudioNotification() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            } catch(e) {}
        }

        function showInstantNotification(order) {
            const div = document.createElement('div');
            div.className = "fixed bottom-5 right-5 bg-gray-900 text-white px-5 py-4 rounded-2xl shadow-2xl z-50 flex items-center space-x-3 border border-emerald-500/30 animate-bounce";
            div.innerHTML = `
                <div class="bg-emerald-500 text-white p-2 rounded-xl">🛍️</div>
                <div>
                    <p class="font-bold text-sm">¡Nuevo Pedido Recibido!</p>
                    <p class="text-xs text-gray-300">${order.customer_name} - Total: $${order.total_amount}</p>
                </div>
            `;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 5000);
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const filtered = currentFilter === 'all' 
                ? products 
                : products.filter(p => p.category_id == currentFilter);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">No hay productos disponibles en esta categoría.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="bg-white border border-gray-100 rounded-2xl p-4 flex flex-col justify-between shadow-2xs hover:shadow-md transition">
                    <div>
                        <div class="aspect-square bg-gray-100 rounded-xl overflow-hidden mb-3 relative">
                            <img src="${p.image_url || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80'}" alt="${p.name}" class="w-full h-full object-cover">
                            <span class="absolute top-2 right-2 bg-white/90 backdrop-blur-xs text-xs font-semibold px-2.5 py-1 rounded-lg text-gray-700">${p.categories?.name || 'General'}</span>
                        </div>
                        <h3 class="font-bold text-gray-900 text-base mb-1">${p.name}</h3>
                        <p class="text-gray-500 text-xs line-clamp-2 mb-3">${p.description || 'Sin descripción'}</p>
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-gray-50">
                        <div>
                            <span class="text-xs text-gray-400 block">Precio</span>
                            <span class="font-black text-emerald-600 text-lg">$${Number(p.price).toFixed(2)}</span>
                        </div>
                        <button onclick='addToCart(${JSON.stringify(p)})' class="bg-emerald-600 hover:bg-emerald-700 text-white p-2.5 rounded-xl transition flex items-center justify-center">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderCategories() {
            const container = document.getElementById('category-filters');
            let html = `<button onclick="filterByCategory('all')" class="category-btn ${currentFilter === 'all' ? 'bg-emerald-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'} px-4 py-2 rounded-xl text-sm font-medium shrink-0 transition">Todos</button>`;
            
            categories.forEach(cat => {
                const active = currentFilter == cat.id;
                html += `<button onclick="filterByCategory(${cat.id})" class="category-btn ${active ? 'bg-emerald-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'} px-4 py-2 rounded-xl text-sm font-medium shrink-0 transition">${cat.name}</button>`;
            });
            container.innerHTML = html;
        }

        function filterByCategory(id) {
            currentFilter = id;
            renderCategories();
            renderProducts();
        }

        function addToCart(product) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                if (existing.quantity < product.stock) {
                    existing.quantity++;
                } else {
                    alert('Has alcanzado el límite del stock disponible.');
                    return;
                }
            } else {
                if (product.stock > 0) {
                    cart.push({ ...product, quantity: 1 });
                } else {
                    alert('Producto agotado.');
                    return;
                }
            }
            updateCartCounter();
        }

        function updateCartCounter() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-counter').innerText = totalItems;
        }

        function openCartModal() {
            const container = document.getElementById('cart-items-container');
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-6">Tu carrito está vacío</p>`;
                document.getElementById('cart-total').innerText = '$0.00';
            } else {
                container.innerHTML = cart.map(item => `
                    <div class="flex items-center justify-between py-3">
                        <div>
                            <h4 class="font-semibold text-sm text-gray-900">${item.name}</h4>
                            <span class="text-xs text-gray-400">$${item.price} x ${item.quantity}</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="font-bold text-sm text-gray-800">$${(item.price * item.quantity).toFixed(2)}</span>
                            <button onclick="removeFromCart(${item.id})" class="text-red-500 hover:text-red-700 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                `).join('');
                const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
            }
            document.getElementById('cart-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartCounter();
            openCartModal();
        }

        async function checkoutOrder() {
            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();

            if (!name || !phone || !address || cart.length === 0) {
                alert('Por favor completa todos los campos y añade productos al carrito.');
                return;
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            try {
                const { data: orderData, error: orderError } = await supabaseClient
                    .from('orders')
                    .insert([{ customer_name: name, customer_phone: phone, delivery_address: address, total_amount: total }])
                    .select()
                    .single();

                if (orderError) throw orderError;

                for (const item of cart) {
                    await supabaseClient.from('order_items').insert([{
                        order_id: orderData.id,
                        product_id: item.id,
                        quantity: item.quantity,
                        price: item.price
                    }]);

                    await supabaseClient.from('products')
                        .update({ stock: item.stock - item.quantity })
                        .eq('id', item.id);
                }

                alert('¡Pedido realizado con éxito!');
                cart = [];
                updateCartCounter();
                closeCartModal();
                fetchInitialData();
            } catch (error) {
                alert('Error al procesar el pedido: ' + error.message);
            }
        }

        function openAdminModal() { document.getElementById('admin-login-modal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('admin-login-modal').classList.add('hidden'); }

        function handleAdminLogin() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;

            if (user === ADMIN_CREDENTIALS.user && pass === ADMIN_CREDENTIALS.pass) {
                closeAdminModal();
                switchView('admin');
                fetchAdminOrders();
            } else {
                alert('Credenciales incorrectas.');
            }
        }

        function switchView(view) {
            if (view === 'catalog') {
                document.getElementById('view-catalog').classList.remove('hidden');
                document.getElementById('view-admin').classList.add('hidden');
            } else {
                document.getElementById('view-catalog').classList.add('hidden');
                document.getElementById('view-admin').classList.remove('hidden');
            }
        }

        function switchAdminTab(tab) {
            if (tab === 'orders') {
                document.getElementById('admin-orders-section').classList.remove('hidden');
                document.getElementById('admin-inventory-section').classList.add('hidden');
                document.getElementById('tab-orders-btn').className = "py-2 px-4 border-b-2 border-emerald-600 font-semibold text-emerald-600 text-sm";
                document.getElementById('tab-inventory-btn').className = "py-2 px-4 border-b-2 border-transparent text-gray-500 text-sm hover:text-gray-700";
            } else {
                document.getElementById('admin-orders-section').classList.add('hidden');
                document.getElementById('admin-inventory-section').classList.remove('hidden');
                document.getElementById('tab-inventory-btn').className = "py-2 px-4 border-b-2 border-emerald-600 font-semibold text-emerald-600 text-sm";
                document.getElementById('tab-orders-btn').className = "py-2 px-4 border-b-2 border-transparent text-gray-500 text-sm hover:text-gray-700";
            }
        }

        async function fetchAdminOrders() {
            const { data, error } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
            if (error) return;

            const list = document.getElementById('admin-orders-list');
            if (!data || data.length === 0) {
                list.innerHTML = `<div class="text-gray-400 py-6 text-center">No hay pedidos recientes.</div>`;
                return;
            }

            list.innerHTML = data.map(o => `
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-2xs flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-gray-900">Pedido #${o.id}</span>
                            <span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-0.5 rounded-full font-semibold">${o.status}</span>
                        </div>
                        <p class="text-sm font-medium text-gray-700 mt-1">Cliente: ${o.customer_name} (${o.customer_phone})</p>
                        <p class="text-xs text-gray-500">Dirección: ${o.delivery_address}</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span class="font-black text-emerald-600 text-lg">$${Number(o.total_amount).toFixed(2)}</span>
                        <button onclick="updateOrderStatus(${o.id}, 'Completado')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-xl transition">Completar</button>
                    </div>
                </div>
            `).join('');
        }

        async function updateOrderStatus(id, status) {
            await supabaseClient.from('orders').update({ status }).eq('id', id);
            fetchAdminOrders();
        }

        function renderAdminInventory() {
            const tbody = document.getElementById('admin-inventory-table');
            if(!products.length) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">Sin productos registrados.</td></tr>`;
                return;
            }
            tbody.innerHTML = products.map(p => `
                <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                    <td class="p-4 flex items-center space-x-3">
                        <img src="${p.image_url || ''}" class="w-10 h-10 object-cover rounded-lg bg-gray-100" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=100&q=80'">
                        <span class="font-medium text-gray-900">${p.name}</span>
                    </td>
                    <td class="p-4 text-gray-500">${p.categories?.name || 'General'}</td>
                    <td class="p-4 font-semibold text-gray-900">$${Number(p.price).toFixed(2)}</td>
                    <td class="p-4"><span class="bg-gray-100 px-2.5 py-1 rounded-lg font-semibold text-xs">${p.stock} un.</span></td>
                    <td class="p-4 text-right space-x-2">
                        <button onclick='openProductModal(${JSON.stringify(p)})' class="text-blue-600 hover:underline text-xs font-semibold">Editar</button>
                        <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:underline text-xs font-semibold">Eliminar</button>
                    </td>
                </tr>
            `).join('');
        }

        function populateCategoryDropdown() {
            const select = document.getElementById('prod-category');
            if(!categories.length) {
                select.innerHTML = `<option value="">No hay categorías</option>`;
                return;
            }
            select.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }

        function openProductModal(product = null) {
            populateCategoryDropdown();
            if (product) {
                document.getElementById('product-modal-title').innerText = "Editar Producto";
                document.getElementById('prod-id').value = product.id;
                document.getElementById('prod-name').value = product.name;
                document.getElementById('prod-desc').value = product.description || '';
                document.getElementById('prod-price').value = product.price;
                document.getElementById('prod-stock').value = product.stock;
                document.getElementById('prod-category').value = product.category_id || '';
                document.getElementById('prod-image').value = product.image_url || '';
            } else {
                document.getElementById('product-modal-title').innerText = "Crear Producto";
                document.getElementById('prod-id').value = '';
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-desc').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-stock').value = '';
                document.getElementById('prod-image').value = '';
            }
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeProductModal() { document.getElementById('product-modal').classList.add('hidden'); }

        async function saveProduct() {
            const id = document.getElementById('prod-id').value;
            const name = document.getElementById('prod-name').value.trim();
            const description = document.getElementById('prod-desc').value.trim();
            const price = parseFloat(document.getElementById('prod-price').value);
            const stock = parseInt(document.getElementById('prod-stock').value);
            const category_id = document.getElementById('prod-category').value ? parseInt(document.getElementById('prod-category').value) : null;
            const image_url = document.getElementById('prod-image').value.trim();

            if (!name || isNaN(price) || isNaN(stock)) {
                alert('Por favor completa los campos obligatorios (Nombre, Precio y Stock).');
                return;
            }

            const payload = { name, description, price, stock, category_id, image_url };

            try {
                let res;
                if (id) {
                    res = await supabaseClient.from('products').update(payload).eq('id', id);
                } else {
                    res = await supabaseClient.from('products').insert([payload]);
                }

                if (res.error) throw res.error;

                closeProductModal();
                fetchInitialData();
                alert('¡Producto guardado exitosamente!');
            } catch (error) {
                alert('Error al guardar el producto: ' + error.message);
            }
        }

        async function deleteProduct(id) {
            if (confirm('¿Estás seguro de eliminar este producto?')) {
                const { error } = await supabaseClient.from('products').delete().eq('id', id);
                if(error) {
                    alert('Error al eliminar: ' + error.message);
                } else {
                    fetchInitialData();
                }
            }
        }
    </script>
